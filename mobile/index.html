<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://127.0.0.1:8088 http://localhost:8088 http://localhost:5175 https:;" />
    <title>Betterway Mobile — UAE Mortgages</title>
    <meta name="theme-color" content="#070E1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <img src="assets/brand/betterway-logo-horizontal-dark-bg.svg" alt="Betterway Mortgages" class="brand-logo" />
        </div>
        <div class="topbar-right">
          <span id="sync-dot" class="sync-pill" title="Real-Time OS Sync"><i class="dot"></i><span id="sync-label">Live</span></span>
          <button id="btn-rtl" type="button" class="icon-btn" aria-label="Toggle Arabic RTL">AR</button>
          <button id="btn-lock" type="button" class="icon-btn" aria-label="Biometric Lock">🔒</button>
        </div>
      </header>

      <!-- 3-Mode App Switcher (Advisor LOS / Borrower Pocket / RERA Partner) -->
      <div class="mode-strip" role="tablist" aria-label="Betterway Mobile Modes">
        <button type="button" class="mode-btn active" data-mode="advisor">Advisor OS</button>
        <button type="button" class="mode-btn" data-mode="borrower">Borrower</button>
        <button type="button" class="mode-btn" data-mode="partner">RERA Partner</button>
      </div>

      <main id="view" class="view-scroll"></main>

      <nav id="dock" class="bottom-dock" aria-label="Primary Navigation"></nav>
    </div>

    <!-- Biometric / Device Lock Overlay (SWK Mobile Hardening Parity) -->
    <div id="lock-overlay" class="lock-overlay hidden" role="dialog" aria-label="Betterway Security Lock">
      <img src="assets/brand/betterway-app-icon-dark-squircle-512x512.png" alt="Betterway" class="lock-icon" />
      <img src="assets/brand/betterway-logo-horizontal-dark-bg.svg" alt="Betterway Mortgages" class="lock-logo" />
      <p class="lock-sub">Session protected by Betterway Device Security &amp; UAE PDPL Vault</p>
      <button id="btn-unlock" type="button" class="btn-primary">Unlock with Biometrics / Face ID</button>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
