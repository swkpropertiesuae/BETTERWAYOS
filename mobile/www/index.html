<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070A0F" />
    <title>Betterway Mortgages OS — Mobile App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(600px circle at 20% 10%, rgba(34, 226, 173, 0.2), transparent 55%),
          radial-gradient(500px circle at 85% 90%, rgba(217, 179, 86, 0.18), transparent 55%),
          #070a0f;
        color: #ffffff;
      }
      .card {
        width: 100%;
        max-width: 400px;
        border-radius: 24px;
        padding: 32px 26px;
        text-align: center;
        background: linear-gradient(155deg, #161d26 0%, #090d13 100%);
        border: 1px solid rgba(34, 226, 173, 0.35);
        box-shadow: 0 28px 60px -18px rgba(0, 0, 0, 0.85);
      }
      .logo { height: 44px; margin-bottom: 18px; }
      h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
      p { margin-top: 10px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
      .cta {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, #119c78, #22e2ad);
        color: #070e1a;
        font-weight: 800;
        font-size: 13px;
        text-decoration: none;
      }
      .meta { margin-top: 18px; font-size: 11px; color: #fbe8a4; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="brand-logo-dark.png" alt="Betterway Mortgages LLC" class="logo" />
      <h1>Betterway Mortgages OS</h1>
      <p>Connecting to your live UAE Mortgage Operating System (18-Bank Rates, 140+ RMs, GPS Field Meetings, Word/JPEG Forms &amp; Daily Excel Backups).</p>
      <a class="cta" href="https://betterwayos.vercel.app/os">Open Live OS Now →</a>
      <div class="meta">Betterway Mortgages LLC · Al Nasr Plaza, Oud Metha, Dubai</div>
    </main>
  </body>
</html>
