name: Betterway OS Mobile Builds (Android APK/AAB & iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-ios.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Mobile Dependencies & Sync Android
        working-directory: mobile
        run: |
          npm install
          npx cap sync android

      - name: Prepare Release Keystore & Build Android APK + AAB
        working-directory: mobile/android
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/betterway-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias betterway \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass betterway2026 \
            -keypass betterway2026 \
            -dname "CN=Betterway Mortgages LLC, OU=Engineering, O=Betterway Mortgages LLC, L=Dubai, ST=Dubai, C=AE"

          export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
          export ANDROID_KEYSTORE_PASSWORD="betterway2026"
          export ANDROID_KEY_ALIAS="betterway"
          export ANDROID_KEY_PASSWORD="betterway2026"

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$APK_SRC" "$GITHUB_WORKSPACE/release-artifacts/Betterway-Mortgages-OS-Android-v3.2.0.apk"
          cp "$AAB_SRC" "$GITHUB_WORKSPACE/release-artifacts/Betterway-Mortgages-OS-Android-v3.2.0.aab"
          ls -lh "$GITHUB_WORKSPACE/release-artifacts"

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Betterway-Mortgages-OS-Android-v3.2.0
          path: |
            release-artifacts/Betterway-Mortgages-OS-Android-v3.2.0.apk
            release-artifacts/Betterway-Mortgages-OS-Android-v3.2.0.aab
          retention-days: 90

  build-ios:
    name: Build iOS Device IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mobile Dependencies & Sync iOS (CocoaPods)
        working-directory: mobile
        run: |
          npm install
          npx cap sync ios

      - name: Build iOS Device App & Package IPA
        working-directory: mobile/ios/App
        run: |
          set -e
          pod install --repo-update || pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R build-device/Build/Products/Release-iphoneos/App.app "$RUNNER_TEMP/Payload/BetterwayMortgagesOS.app"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/release-artifacts/Betterway-Mortgages-OS-iOS-v3.2.0.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/release-artifacts"

      - name: Build iOS Simulator App
        working-directory: mobile/ios/App
        run: |
          set -e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          (cd build-sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/release-artifacts/Betterway-Mortgages-OS-iOS-Simulator-v3.2.0.app.zip" App.app)
          ls -lh "$GITHUB_WORKSPACE/release-artifacts"

      - name: Upload iOS IPA & Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Betterway-Mortgages-OS-iOS-v3.2.0
          path: |
            release-artifacts/Betterway-Mortgages-OS-iOS-v3.2.0.ipa
            release-artifacts/Betterway-Mortgages-OS-iOS-Simulator-v3.2.0.app.zip
          retention-days: 90

  publish-mobile-release:
    name: Publish Android & iOS Packages to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android & iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-mobile-artifacts
          merge-multiple: true

      - name: Publish to mobile-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -lh all-mobile-artifacts
          TAG="mobile-latest"
          REPO="${{ github.repository }}"
          TITLE="Betterway Mortgages OS Mobile v3.2.0 (Android APK/AAB & iOS IPA)"
          NOTES="Automated native Capacitor 7 builds for **Betterway Mortgages OS v3.2.0** (Oxford Midnight Navy Sovereign Corporate Edition). Includes Betterway Inside messaging, WebRTC SIP Cloud Calls, Universal Form Attachments & Task Follow-Ups, 18-Bank 2026 Matrix, Oud Metha QR Attendance, and GPS Field Meetings."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" all-mobile-artifacts/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" all-mobile-artifacts/* --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          fi
