      <path d="M 218 329 L 250 300 L 250 375 L 218 375 Z" fill="#0A1424" opacity="0.96"/>
      <path d="M 326 329 L 294 300 L 294 375 L 326 375 Z" fill="#0A1424" opacity="0.96"/>

      <!-- Clean gold architectural plinth anchoring the portal -->
      <rect x="208" y="375" width="128" height="7" rx="1.5" fill="url(#bw-icon-light-gold-roof)"/>
    </g>
    
