      <!-- Delicate satin gold specular arc along the brushed gold lower-right ribbon -->
      <path d="M 192 426 A 141 141 0 0 0 407 284"
            stroke="#EDD48D" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.58"/>

