<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <title>Betterway Mortgages — Brandmark Icon (mono_white)</title>
  <defs>
    <!-- Circular Bowl Clip -->
    <clipPath id="ico-mono-bowl-clip">
      <circle cx="256" cy="300" r="146"/>
    </clipPath>

    <!-- Gold Metallic Base Disc Gradient -->
    <linearGradient id="ico-mono-gold-base" x1="158" y1="218" x2="386" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#144538"/>
      <stop offset="22%"  stop-color="#6B6D37"/>
      <stop offset="46%"  stop-color="#B98D37"/>
      <stop offset="70%"  stop-color="#E7C469"/>
      <stop offset="86%"  stop-color="#FCF1B7"/>
      <stop offset="100%" stop-color="#CEA449"/>
    </linearGradient>

    <!-- Satin Sweeping Gold Ribbon Fold on Lower-Right Arc -->
    <linearGradient id="ico-mono-gold-ribbon" x1="184" y1="436" x2="398" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#A67B2B"/>
      <stop offset="28%"  stop-color="#D2AA52"/>
      <stop offset="56%"  stop-color="#F7E195"/>
      <stop offset="74%"  stop-color="#FFF3C0"/>
      <stop offset="92%"  stop-color="#D8B056"/>
      <stop offset="100%" stop-color="#9A7024"/>
    </linearGradient>

    <!-- Deep Concave Recessed Shadow behind Roof & Chimney -->
    <radialGradient id="ico-mono-bowl-inner-depth" cx="250" cy="236" r="158" fx="242" fy="206" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#063128" stop-opacity="0.97"/>
      <stop offset="38%"  stop-color="#0D4B3C" stop-opacity="0.90"/>
      <stop offset="63%"  stop-color="#2A5B42" stop-opacity="0.54"/>
      <stop offset="83%"  stop-color="#7B7436" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#B88E38" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Cast Shadow from Emerald Stem Tongue onto Gold Bowl -->
    <linearGradient id="ico-mono-stem-cast" x1="152" y1="364" x2="216" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#052620" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#4A411B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#997228" stop-opacity="0"/>
    </linearGradient>

    <!-- Primary Sculpted Emerald Ribbon (Stem + Tapered Upper Arch) -->
    <linearGradient id="ico-mono-emerald-arch" x1="156" y1="84" x2="368" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#34DFAC"/>
      <stop offset="24%"  stop-color="#22BA90"/>
      <stop offset="52%"  stop-color="#179373"/>
      <stop offset="80%"  stop-color="#0E6954"/>
      <stop offset="100%" stop-color="#0A4A3E"/>
    </linearGradient>

    <!-- Silky Outer Left Shading of Ascender Stem (Blends Seamlessly into Lower Tongue) -->
    <linearGradient id="ico-mono-emerald-stem-outer" x1="110" y1="74" x2="152" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2AD1A2" stop-opacity="0.92"/>
      <stop offset="32%"  stop-color="#199B7A" stop-opacity="0.82"/>
      <stop offset="66%"  stop-color="#0F6753" stop-opacity="0.72"/>
      <stop offset="92%"  stop-color="#0A4A3E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A4A3E" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Vertical Luminous Highlight Ridge on Inner Stem Fold -->
    <linearGradient id="ico-mono-emerald-ridge" x1="148" y1="90" x2="180" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#52F0C0" stop-opacity="0.48"/>
      <stop offset="35%"  stop-color="#27C599" stop-opacity="0.22"/>
      <stop offset="75%"  stop-color="#137C63" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A4A3E" stop-opacity="0"/>
    </linearGradient>

    <!-- Architectural Gold Pitched Roof & Chimney (Unified Luminous Satin) -->
    <linearGradient id="ico-mono-roof-gold" x1="210" y1="226" x2="338" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#CE9E43"/>
      <stop offset="32%"  stop-color="#F7DF8D"/>
      <stop offset="48%"  stop-color="#FFF2B6"/>
      <stop offset="72%"  stop-color="#DDB355"/>
      <stop offset="100%" stop-color="#AA7D29"/>
    </linearGradient>

    <!-- Wordmark Metallic Gold Gradient (Dark Backgrounds) -->
    <linearGradient id="ico-mono-text-gold" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%"   stop-color="#C89E44"/>
      <stop offset="28%"  stop-color="#EED380"/>
      <stop offset="54%"  stop-color="#D7AF55"/>
      <stop offset="82%"  stop-color="#F3DA8A"/>
      <stop offset="100%" stop-color="#C89C41"/>
    </linearGradient>

    <!-- Wordmark Rich Burnished Gold Gradient (Light Backgrounds) -->
    <linearGradient id="ico-mono-text-gold-light" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop offset="0%"   stop-color="#9B7222"/>
      <stop offset="30%"  stop-color="#C99E41"/>
      <stop offset="56%"  stop-color="#AF832C"/>
      <stop offset="84%"  stop-color="#D2A748"/>
      <stop offset="100%" stop-color="#966E20"/>
    </linearGradient>

    <!-- Monochrome Luxury Gold Vertical Sheen -->
    <linearGradient id="ico-mono-mono-gold" x1="110" y1="66" x2="402" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F5DC8E"/>
      <stop offset="35%"  stop-color="#E0B95F"/>
      <stop offset="68%"  stop-color="#C69B40"/>
      <stop offset="100%" stop-color="#F1D683"/>
    </linearGradient>
    
  </defs>
  
    <g id="Brandmark-Mono-mono_white">
      <path id="Brandmark-Compound-Path" fill="#FFFFFF" fill-rule="evenodd" d="M 110 66 C 150 66, 178 96, 178 138 L 178 176.58 A 146.0 146.0 0 1 1 110 300 L 110 66 Z M 186 271 C 191 221, 224 192, 270 192 C 324 192, 366 225, 381 273 L 349 290 L 323 268 L 323 227 L 290 227 L 290 241 L 256 211 L 186 271 Z M 256 240.5 L 319 295.5 L 319 364 L 274 364 L 274 314 L 238 314 L 238 364 L 193 364 L 193 295.5 Z M 243.4 340 A 3.6 3.6 0 1 0 250.6 340 A 3.6 3.6 0 1 0 243.4 340 Z"/>
    </g>
</svg>
