services:
  betterway-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betterway-os
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3001
      BW_OS_DATA_DIR: /var/lib/betterway-os
    volumes:
      - betterway_os_data:/var/lib/betterway-os

volumes:
  betterway_os_data:
