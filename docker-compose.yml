services:
  betterway-os:
    build: .
    container_name: betterway-mortgages-os
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      NODE_ENV: production
      PORT: 8088
      BETTERWAY_DB_PATH: /app/data/betterway-os.sqlite
    volumes:
      - betterway_data:/app/data

volumes:
  betterway_data:
